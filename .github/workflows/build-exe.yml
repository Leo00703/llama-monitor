name: Build Windows tray exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default least-privilege (#96): only the job that commits the refreshed
# exe back to main gets contents: write (job level, see build-exe).
permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # Python 3.14 on Windows needs this for case-insensitive imports
      # (the PyInstaller package dir has mixed case). Harmless otherwise.
      PYTHONCASEOK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      # The refresh step below commits the built exe back to main, which
      # triggers this workflow again. Detect that self-trigger by the bot's
      # own last commit (message + author) and skip the whole build, which
      # terminates the loop after one extra run. Anything the user pushes
      # always triggers a real rebuild.
      - name: Detect CI self-update (this push only refreshed the bundled exe)
        id: skip
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          author=$(git log -1 --pretty=%an)
          subject=$(git log -1 --pretty=%s)
          if [ "$author" = "github-actions[bot]" ] && [ "$subject" = "Build: refresh bundled tray exe" ]; then
            echo "::notice::This push only refreshed the bundled exe — skipping rebuild"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          # Hash-verified build environment (#96): the lock is generated with
          # uv pip compile --generate-hashes for windows/cp312 (this job's
          # python). Regenerate after changing requirements*.txt.
          pip install --require-hashes -r requirements.lock.txt

      - name: Smoke test (panel boot + health)
        if: steps.skip.outputs.skip != 'true'
        run: python tray.py --smoke

      - name: Write build info (commit baked into the exe)
        if: steps.skip.outputs.skip != 'true'
        run: |
          python -c "import json,os,datetime;json.dump({'sha':os.environ.get('GITHUB_SHA','unknown')[:9],'date':datetime.datetime.now().astimezone().isoformat(timespec='seconds')},open('backend/_buildinfo.json','w'))"

      - name: Build single-file exe
        if: steps.skip.outputs.skip != 'true'
        run: |
          pyinstaller --noconfirm --onefile --noconsole --name llama-monitor `
            --icon assets/tray/icon.ico `
            --add-data "frontend;frontend" `
            --add-data "config.example.json;." `
            --add-data "backend/_buildinfo.json;backend" `
            --add-data "assets/tray;assets/tray" `
            --hidden-import pystray._win32 `
            --hidden-import six `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.wsproto_impl `
            --hidden-import uvicorn.protocols.websockets.websockets_impl `
            --hidden-import websockets `
            --hidden-import wsproto `
            tray.py

      # The onefile bootloader path (self-extract + the retried native
      # import bootstrap in tray.py, #64) is only exercised by running the
      # actual exe — the dev smoke above cannot catch a frozen-only break.
      - name: Smoke test the frozen exe
        if: steps.skip.outputs.skip != 'true'
        run: .\dist\llama-monitor.exe --smoke

      - name: Commit refreshed exe to the repo root (so `git pull` ships it)
        if: steps.skip.outputs.skip != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          new_sha=$(sha256sum dist/llama-monitor.exe | cut -d' ' -f1)
          # (#151) main routinely moves during the minutes-long build (every
          # push triggers a refresh; PyInstaller output is not byte-stable),
          # so a bare push gets rejected: a red badge on a healthy commit and
          # a stale shipped exe. Re-align onto the current main tip before
          # EVERY attempt — our commit only replaces the exe blob, so
          # resetting to the tip and re-committing from dist/ is a conflict-
          # free rebase for a shallow (fetch-depth: 1) checkout, and the
          # sha-compare against the NEW tip also catches "main already ships
          # this exact exe".
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch --depth 1 origin main
            git reset --hard FETCH_HEAD
            old_sha=$(git show HEAD:llama-monitor.exe 2>/dev/null | sha256sum | cut -d' ' -f1 || true)
            if [ "$new_sha" = "$old_sha" ]; then
              echo "::notice::main already ships this exact exe build — nothing to commit"
              pushed=1
              break
            fi
            cp dist/llama-monitor.exe llama-monitor.exe
            git add llama-monitor.exe
            git commit -m "Build: refresh bundled tray exe"
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            echo "push rejected (main moved during the build) — re-aligning, attempt $attempt/5"
            sleep $((attempt * 5))
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not publish the refreshed exe after 5 attempts — main unchanged"
            exit 1
          fi

      - name: Upload artifact
        if: steps.skip.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-monitor
          path: dist/llama-monitor.exe
